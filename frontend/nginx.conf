server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container.
    # `/api/auth/login` -> `http://backend:3000/auth/login`
    # The Docker DNS resolver lets nginx pick up a new backend IP after a restart.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3000;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # The backend sets cookie paths like /auth/refresh; expose them under /api.
        proxy_cookie_path / /api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    # Serve uploaded attendance photos from the backend container.
    location /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3000;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
